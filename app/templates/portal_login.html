{% extends "admin_base.html" %}
{% block title %}دخول صاحب المحل - لمسة{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="split-auth-card">

    <div class="auth-form-side">
      <div class="auth-brand">
        <svg viewBox="0 0 100 100" class="auth-logo">
          <path class="logo-star" d="M50,16 L58.52,38.27 L82.34,39.49 L63.79,54.48 L69.99,77.51 L50,64.5 L30.01,77.51 L36.21,54.48 L17.66,39.49 L41.48,38.27 Z"/>
          <path class="logo-ripple" d="M60,12 A8,8 0 0,1 75,15" fill="none" stroke-width="2.8" stroke-linecap="round"/>
          <path class="logo-ripple" d="M54,3 A17,17 0 0,1 82,10" fill="none" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
        <span class="auth-title">لمسة</span>
      </div>

      <div class="auth-header">
        <h1>بوابة التاجر</h1>
        <p class="muted">أدخل بريدك الإلكتروني ليصلك رمز تسجيل الدخول</p>
      </div>

      <form method="post" action="/portal/login" class="auth-form">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" autofocus required placeholder="owner@example.com">
        {% if error %}
          <p class="auth-error" role="alert">{{ error }}</p>
        {% endif %}
        <button class="btn auth-btn" type="submit">إرسال الرمز</button>
      </form>
    </div>

    <div class="auth-banner-side">
      <img class="for-light" src="/static/illustrations/hero-light.jpg" alt="لمسة NFC">
      <img class="for-dark" src="/static/illustrations/hero-dark.jpg" alt="لمسة NFC">
    </div>

  </div>
</div>

<style>
  .split-auth-card {
    display: flex;
    max-width: 860px;
    width: 100%;
    min-height: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
  }
  .auth-form-side {
    flex: 1.1;
    padding: 50px 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .auth-logo { width: 36px; height: 36px; }
  .auth-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 20px; }
  .auth-header h1 { font-size: 24px; margin: 0 0 6px; }
  .auth-header p { margin: 0 0 26px; font-size: 14px; }
  .auth-form input[type=email] { margin-bottom: 12px; padding: 13px 15px; font-size: 15px; }
  .auth-error { color: var(--danger); font-size: 13px; margin: -4px 0 12px; }
  .auth-btn { width: 100%; justify-content: center; padding: 13px; font-size: 15px; margin-top: 6px; }
  .auth-banner-side {
    flex: 1;
    background: var(--card-2);
    border-inline-start: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-banner-side img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 768px) {
    .split-auth-card { max-width: 420px; min-height: auto; }
    .auth-banner-side { display: none; }
    .auth-form-side { padding: 36px 24px; }
  }
</style>
{% endblock %}
