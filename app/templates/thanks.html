{% extends "base.html" %}
{% block title %}شكرًا لك{% endblock %}
{% block content %}
<div class="thanks-wrapper">
  <div class="thanks-card">
    <div class="icon-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <h2>شكرًا لك</h2>
    <p>وصلت ملاحظتك إلى إدارة <strong>{{ tenant.name }}</strong> مباشرة، وسيتم التواصل معك إن احتجت ذلك.</p>
  </div>
</div>

<style>
  .thanks-wrapper {
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .thanks-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 44px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  }

  .icon-ring {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--sage-bg);
    color: var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-ring svg {
    width: 32px;
    height: 32px;
  }

  .thanks-card h2 {
    font-family: 'Cairo', sans-serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--text);
  }

  .thanks-card p {
    color: var(--text-soft);
    font-size: 14.5px;
    line-height: 1.7;
    margin: 0;
  }

  .thanks-card strong {
    color: var(--text);
  }
</style>
{% endblock %}
